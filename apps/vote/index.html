<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投票アプリ</title>
<link rel="stylesheet" href="../../common/style.css">
<style>
  .q { font-size: 20px; font-weight: 700; margin: 4px 0 12px; }
  .pics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .pics.one { grid-template-columns: 1fr; }
  .pic { position: relative; background: #eee; border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; position: relative; z-index: 1; }
  .pics.one .pic { aspect-ratio: 1 / 1; max-width: 380px; margin: 0 auto; }
  .pic .lab { z-index: 2; position: absolute; left: 8px; top: 8px; background: var(--pur); color: #fff; font-weight: 700; border-radius: 99px; padding: 2px 12px; font-size: 18px; }
  .pic .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--sub); font-size: 14px; text-align: center; padding: 8px; }
  .cap { font-size: 13px; color: var(--sub); margin-top: 4px; }
  .texts { display: grid; gap: 8px; margin-bottom: 12px; }
  .texts div { background: var(--pur-t); border-radius: 10px; padding: 10px 12px; }
  .choices { display: grid; gap: 10px; }
  .choices.two { grid-template-columns: 1fr 1fr; }
  .choices button { min-height: 72px; font-size: 22px; }
  .wait { text-align: center; padding: 40px 10px; color: var(--sub); }
  .big-mark { font-size: 54px; }
  .names { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 10px 0; }
  .names button { background: #fff; color: var(--ink); border: 2px solid var(--rule); font-size: 14px; min-height: 52px; padding: 6px 2px; white-space: nowrap; letter-spacing: -0.02em; }
  .mebar { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-weight: 700; }
  .mebar button { min-height: 36px; padding: 4px 12px; font-size: 14px; }
  .mebar .pt { margin-left: auto; color: var(--pur); }
  .judge { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .myrank { text-align: center; background: var(--amb-t); border-color: var(--amb); }
  .myrank .big { font-size: 40px; font-weight: 800; color: var(--pur); }
</style>
</head>
<body>
<header class="app"><h1>投票アプリ</h1><span class="tag" id="setname"></span></header>
<main>
  <div id="mebar" class="mebar hidden"><span id="mename"></span><button class="ghost" id="chg">変える</button><span class="pt" id="mypt"></span></div>
  <div id="namebox" class="card hidden">
    <h2>机のカードと同じ どうぶつ をえらぼう</h2>
    <div id="names" class="names"></div>
    <p class="muted">名前や学校名は使いません。点数とランキングは、どうぶつの名前で発表します。とちゅうで変えると、点数が分かれるので気をつけてね。</p>
  </div>
  <div id="myrank" class="card myrank hidden"></div>
  <div id="wait" class="card wait">
    <div class="big-mark">⏳</div>
    <p>先生が問題を出すまで、少し待ってね。</p>
    <p class="muted">先生の画面で問題が出ると、自動で切りかわります。</p>
    <p class="muted" id="privacy">名前や学校名は送りません。選んだ答えだけを送ります。</p>
  </div>
  <div id="qbox" class="card hidden">
    <div class="q" id="qtext"></div>
    <div id="pics" class="pics"></div>
    <div id="texts" class="texts"></div>
    <div id="choices" class="choices"></div>
    <p id="sent" class="ok hidden"></p>
    <p id="reveal" class="note hidden"></p>
  </div>
  <p class="muted">2人で相談してOK。答えは何回でも変えられます（最後に選んだものが答えになります）。</p>
</main>
<footer class="app">愛知県立高等専門学校 公開講座「使う人から作る人へ」</footer>
<script src="../../common/config.js"></script>
<script src="../../common/api.js"></script>
<script src="questions.js?v=20261119"></script>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var SETID = qs.get("set") || "koza2";
  var SET = (window.VOTE_SETS || {})[SETID];
  var $ = function (id) { return document.getElementById(id); };
  if (!SET) { $("wait").innerHTML = "<p>問題が見つかりません（set=" + esc(SETID) + "）</p>"; return; }
  $("setname").textContent = SET.title;
  var COLORS = ["sky", "coral", "mint", "amb", "ghost"];
  var current = null, mine = {}, lastState = null;
  var SCORED = !!SET.scored, NAMES = SET.names || [];
  var myName = null, scores = {}, session = "";
  function lget(k, d) { try { var v = localStorage.getItem(k + SETID); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lset(k, v) { try { localStorage.setItem(k + SETID, JSON.stringify(v)); } catch (e) {} }
  mine = lget("vote_mine_", {}); scores = lget("vote_score_", {}); session = lget("vote_ss_", "");
  myName = lget("vote_name_", null); if (myName !== null && !NAMES[myName]) myName = null;
  if (SCORED) $("privacy").textContent = "名前や学校名は送りません。選んだ答えと、どうぶつの名前だけを送ります。";

  function findQ(id) { for (var i = 0; i < SET.questions.length; i++) if (SET.questions[i].id === id) return SET.questions[i]; return null; }
  function pts(q) { return q.points || 1; }
  function total() { return Object.keys(scores).reduce(function (a, k) { return a + scores[k]; }, 0); }

  // どうぶつの名前（点数制のときだけ）
  NAMES.forEach(function (n, i) {
    var b = document.createElement("button"); b.textContent = n;
    b.onclick = function () { myName = i; lset("vote_name_", i); showMe(); render(lastState); };
    $("names").appendChild(b);
  });
  $("chg").onclick = function () { myName = null; showMe(); render(lastState); };
  function showMe() {
    if (!SCORED) return;
    $("mebar").classList.toggle("hidden", myName === null);
    if (myName !== null) { $("mename").textContent = NAMES[myName]; $("mypt").textContent = "あなたの点数：" + total() + "点"; }
  }

  function picHTML(src, label, cap) {
    return '<div><div class="pic"><div class="ph">写真' + esc(label) + '<br>（先生が用意した写真が入ります）</div>' +
      '<img src="' + esc(src) + '" alt="写真' + esc(label) + '" onerror="this.remove()">' +
      (label ? '<span class="lab">' + esc(label) + '</span>' : '') + '</div>' + (cap ? '<div class="cap">' + esc(cap) + '</div>' : '') + '</div>';
  }

  function showRank(state) {
    var box = $("myrank");
    if (!SCORED || !state || !state.rk || myName === null) { box.classList.add("hidden"); return; }
    var m = null, all = [];
    String(state.rk).split(",").forEach(function (e) { var a = e.split(":"); if (a.length >= 2) all.push(a); });
    all.forEach(function (a) {
      if (+a[0] !== myName) return;
      if (a.length >= 3) { m = a; return; }                        // 前の形：番号:順位:点数
      var sc = +a[1], rank = 1 + all.filter(function (b) { return +b[b.length - 1] > sc; }).length;   // 自分より点数が高い人の数＋1
      m = [a[0], rank, sc];
    });
    box.classList.remove("hidden");
    box.innerHTML = "<div>🏆 " + esc(state.rt || "ランキング") + "</div>" +
      (m ? '<div class="big">' + esc(m[1]) + "位</div><div>" + esc(NAMES[myName]) + "　" + esc(m[2]) + "点（満点 " + esc(state.mx || "") + "点）</div>"
         : "<div>まだ点数がありません</div>");
  }

  function render(state) {
    lastState = state;
    if (SCORED && state && state.ss && state.ss !== session) {   // 先生が「はじめからやり直す」を押した
      session = state.ss; lset("vote_ss_", session); mine = {}; scores = {}; lset("vote_mine_", mine); lset("vote_score_", scores); current = null; showMe();
    }
    if (SCORED && myName === null) {
      $("namebox").classList.remove("hidden"); $("wait").classList.add("hidden"); $("qbox").classList.add("hidden"); $("myrank").classList.add("hidden");
      return;
    }
    $("namebox").classList.add("hidden");
    showRank(state);
    var q = state && findQ(state.q);
    if (!q) { $("wait").classList.remove("hidden"); $("qbox").classList.add("hidden"); current = null; return; }
    $("wait").classList.add("hidden"); $("qbox").classList.remove("hidden");
    var tag = q.id + "_" + (state.round || 0);
    if (!current || current.tag !== tag) {
      current = { id: q.id, tag: tag, q: q };
      $("qtext").textContent = q.text;
      var imgs = q.images || [];
      $("pics").className = "pics" + (imgs.length === 1 ? " one" : "");
      $("pics").innerHTML = imgs.map(function (src, i) { return picHTML(src, imgs.length > 1 ? q.choices[i] : "", (q.images && q.texts) ? q.texts[i] : ""); }).join("");
      $("texts").innerHTML = (!q.images && q.texts) ? q.texts.map(function (t, i) { return "<div><b>" + esc(q.choices[i]) + "</b>：" + esc(t) + "</div>"; }).join("") : "";
      $("choices").className = "choices" + (q.choices.length === 2 ? " two" : "");
      $("choices").innerHTML = q.choices.map(function (c, i) { return '<button class="' + COLORS[i % COLORS.length] + '" data-c="' + esc(c) + '">' + esc(c) + "</button>"; }).join("");
      Array.prototype.forEach.call($("choices").querySelectorAll("button"), function (b) {
        b.onclick = function () { vote(b.getAttribute("data-c")); };
      });
      showMine();
    }
    if (state.reveal) {
      showMine();
      var judge = "";
      if (SCORED && q.answer) {
        var m = mine[tag], got = m === q.answer ? pts(q) : 0;
        scores[q.id] = got; lset("vote_score_", scores); showMe();
        judge = '<div class="judge">' + (!m ? "答えていません" : got ? "⭕ 正解！ +" + got + "点" : "❌ ざんねん！") + "</div>";
      }
      $("reveal").classList.remove("hidden");
      $("reveal").innerHTML = judge + (q.answer ? "正解は <b>" + esc(q.answer) + "</b>！" : "答えは、先生の話を聞こう。") + (q.hint ? "<br>" + esc(q.hint) : "");
    } else $("reveal").classList.add("hidden");
  }

  function showMine() {
    var m = current && mine[current.tag];
    Array.prototype.forEach.call($("choices").querySelectorAll("button"), function (b) { b.classList.toggle("sel", b.getAttribute("data-c") === m); });
    var done = lastState && lastState.reveal && current && lastState.q === current.id;   // 正解が出たあとは変えられない
    if (m) { $("sent").className = "ok"; $("sent").textContent = "送りました：「" + m + "」" + (done ? "" : "（変えるときは、もう一度えらぶ）"); }
    else $("sent").classList.add("hidden");
  }

  function vote(c) {
    if (!current) return;
    if (lastState && lastState.reveal && lastState.q === current.id) return;   // 正解が出たあとは変えられない
    var tag = current.tag;
    mine[tag] = c; lset("vote_mine_", mine);
    showMine();
    KozaAPI.put("v_" + SETID + "_" + tag, SCORED ? c + "|" + myName : c).catch(function () {
      $("sent").className = "warn"; $("sent").textContent = "送れませんでした。もう一度えらんでください。";
    });
  }
  showMe();

  KozaAPI.poll("vstate_" + SETID, function (rows) {
    var last = rows.length ? KozaAPI.parse(rows[rows.length - 1].value, null) : null;
    render(last);
  }, 2500);
})();
</script>
</body>
</html>
