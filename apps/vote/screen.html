<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投票アプリ（先生の画面）</title>
<link rel="stylesheet" href="../../common/style.css">
<style>
  .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
  .q { font-size: 30px; font-weight: 800; margin: 0 0 12px; }
  .pics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pics.one { grid-template-columns: 1fr; }
  .pic { position: relative; background: #eee; border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; position: relative; z-index: 1; }
  .pics.one .pic { aspect-ratio: 1 / 1; max-width: 460px; margin: 0 auto; }
  .pic .lab { z-index: 2; position: absolute; left: 10px; top: 10px; background: var(--pur); color: #fff; font-weight: 800; border-radius: 99px; padding: 2px 16px; font-size: 26px; }
  .pic .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--sub); font-size: 18px; text-align: center; padding: 10px; }
  .cap { font-size: 16px; color: var(--sub); margin-top: 4px; }
  .texts div { background: var(--pur-t); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; font-size: 22px; }
  .bars { display: grid; gap: 12px; }
  .bar.correct > i { background: var(--mint); }
  .count { font-size: 22px; color: var(--sub); margin: 10px 0; }
  .ctrl { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .ctrl button { font-size: 18px; }
  .side { display: flex; gap: 14px; align-items: flex-start; }
  #qlist { font-size: 16px; }
  .manual input { width: 90px; font-size: 22px; text-align: center; }
  .manual .row { margin-bottom: 6px; }
  .rankview { position: fixed; inset: 0; background: var(--bg); z-index: 30; overflow: auto; padding: 18px 28px; }
  .rankview h2 { font-size: 40px; margin: 0; }
  .rankhead { display: flex; align-items: baseline; gap: 18px; margin-bottom: 14px; }
  .rankhead .muted { font-size: 20px; }
  .podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 16px; align-items: end; margin-bottom: 16px; }
  .pod { border-radius: 18px; text-align: center; padding: 14px 10px; color: #fff; display: flex; flex-direction: column; justify-content: flex-end; }
  .pod.r1 { background: var(--amb); height: 310px; } .pod.r2 { background: var(--sky); height: 260px; } .pod.r3 { background: var(--coral); height: 220px; }
  .pod .medal { font-size: 50px; } .pod .sc { font-size: 24px; }
  .pod .who { font-size: 32px; font-weight: 800; line-height: 1.25; }
  .pod .who.m2 { font-size: 26px; } .pod .who.m3 { font-size: 20px; }
  .pod .who .nm { display: block; white-space: nowrap; } .pod .who.m3 .nm { display: inline-block; margin: 0 6px; }
  .pod .hide { font-size: 70px; font-weight: 800; opacity: .9; }
  .rlist { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .rlist div { background: #fff; border: 1px solid var(--rule); border-radius: 10px; padding: 8px 12px; font-size: 20px; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
  .rlist .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; } .rlist .sc { font-weight: 700; }
  .rankview.many .pod.r1 { height: 200px; } .rankview.many .pod.r2 { height: 170px; } .rankview.many .pod.r3 { height: 145px; }
  .rankview.many .pod .medal { font-size: 36px; } .rankview.many .podium { margin-bottom: 10px; }
  .rankview.many .rlist { grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .rankview.many .rlist div { font-size: 16px; padding: 4px 8px; gap: 4px; }
  .rlist b { color: var(--pur); margin-right: 6px; }
  .subctrl { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .subctrl button { font-size: 16px; min-height: 40px; padding: 6px 12px; }
</style>
</head>
<body class="screen">
<header class="app"><h1>投票アプリ（先生の画面）</h1><span class="tag" id="setname"></span></header>
<main class="wide">
  <div class="layout">
    <section class="card">
      <div class="q" id="qtext">問題を選んでください</div>
      <div id="pics" class="pics"></div>
      <div id="texts" class="texts"></div>
      <p id="hint" class="note hidden"></p>
    </section>
    <section class="card">
      <div class="side">
        <div class="grow">
          <div class="count" id="count">答えた人：0</div>
          <div class="bars" id="bars"></div>
          <div id="manual" class="manual hidden"></div>
        </div>
        <div style="text-align:center">
          <div class="qrbox"><canvas id="qr"></canvas></div>
          <div class="muted">生徒はここから</div>
        </div>
      </div>
      <div class="ctrl">
        <button class="ghost" id="prev">◀ 前</button>
        <button id="next">次 ▶</button>
        <button class="mint" id="reveal">正解を見せる</button>
        <button class="amb" id="again">この問題をやり直す</button>
        <button class="ghost" id="hand">手で数を入れる</button>
      </div>
      <div class="subctrl" id="scorectrl">
        <button class="amb" id="rank">🏆 ランキング</button>
        <button class="ghost" id="restart">はじめからやり直す（全問）</button>
      </div>
      <div class="row" style="margin-top:12px">
        <select id="qlist" class="grow"></select>
      </div>
      <p class="muted">「手で数を入れる」は、Wi-Fiが止まったときの手挙げ用です。</p>
    </section>
  </div>
</main>
<div id="rankview" class="rankview hidden">
  <div class="rankhead"><h2 id="rtitle">🏆 ランキング</h2><span class="muted" id="rsub"></span></div>
  <div class="podium" id="podium"></div>
  <div class="rlist" id="rlist"></div>
  <p class="warn hidden" id="rwarn"></p>
  <div class="ctrl">
    <button class="amb" id="rnext">次の順位を発表 ▶</button>
    <button class="ghost" id="rall">全部見せる</button>
    <button class="ghost" id="rre">集計しなおす</button>
    <button class="ghost" id="rclose">とじる</button>
  </div>
</div>
<script src="../../common/config.js"></script>
<script src="../../common/api.js"></script>
<script src="../../common/qrcode.js"></script>
<script src="questions.js?v=20261119"></script>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var SETID = qs.get("set") || "koza2";
  var SET = window.VOTE_SETS[SETID];
  var $ = function (id) { return document.getElementById(id); };
  $("setname").textContent = SET.title;
  var Q = SET.questions, idx = -1, state = { q: null, reveal: false, round: 0 }, stopPoll = null, rounds = {}, manualOn = false, manual = {};
  var SCORED = !!SET.scored, NAMES = SET.names || [], SS = "";
  if (!SCORED) $("scorectrl").classList.add("hidden");
  function pts(q) { return q.points || 1; }
  // 答えは「A」または「A|どうぶつの番号」の形で記録される
  function parseVote(v) { v = String(v); var k = v.lastIndexOf("|"); return k < 0 ? { c: v, n: null } : { c: v.slice(0, k), n: +v.slice(k + 1) }; }

  // 生徒用のURL（このページと同じ設定で index.html を開く）
  var stu = new URL("index.html", location.href);
  stu.searchParams.set("set", SETID);
  ["room", "api"].forEach(function (k) { if (qs.get(k)) stu.searchParams.set(k, qs.get(k)); });
  drawQR($("qr"), stu.href, 220);

  Q.forEach(function (q, i) { var o = document.createElement("option"); o.value = i; o.textContent = (i + 1) + ". " + q.text; $("qlist").appendChild(o); });

  function pic(src, label, cap) {
    return '<div><div class="pic"><div class="ph">写真' + esc(label) + '<br>（img フォルダに写真を置くと表示）</div><img src="' + esc(src) + '" onerror="this.remove()">' +
      (label ? '<span class="lab">' + esc(label) + "</span>" : "") + "</div>" + (cap ? '<div class="cap">' + esc(cap) + "</div>" : "") + "</div>";
  }
  function show(i) {
    idx = Math.max(0, Math.min(Q.length - 1, i));
    var q = Q[idx]; $("qlist").value = idx;
    $("qtext").textContent = q.text;
    var imgs = q.images || [];
    $("pics").className = "pics" + (imgs.length === 1 ? " one" : "");
    $("pics").innerHTML = imgs.map(function (s, k) { return pic(s, imgs.length > 1 ? q.choices[k] : "", q.texts ? q.texts[k] : ""); }).join("");
    $("texts").innerHTML = (!q.images && q.texts) ? q.texts.map(function (t, k) { return "<div><b>" + esc(q.choices[k]) + "</b>：" + esc(t) + "</div>"; }).join("") : "";
    $("hint").classList.add("hidden");
    state = { q: q.id, reveal: false, round: rounds[q.id] || 0, ss: SS };
    KozaAPI.put("vstate_" + SETID, state);
    manual = {}; drawBars({});
    if (stopPoll) stopPoll();
    stopPoll = KozaAPI.poll("v_" + SETID + "_" + q.id + "_" + state.round, function (rows) { if (!manualOn) drawBars(tally(rows)); }, 2000);
    renderManual();
  }
  function tally(rows) {
    var m = KozaAPI.byClient(rows), c = {};
    Object.keys(m).forEach(function (k) { var v = parseVote(m[k].value).c; c[v] = (c[v] || 0) + 1; });
    return c;
  }
  function drawBars(c) {
    var q = Q[idx]; if (!q) return;
    var total = q.choices.reduce(function (s, ch) { return s + (c[ch] || 0); }, 0);
    $("count").textContent = "答えた人：" + total;
    $("bars").innerHTML = q.choices.map(function (ch) {
      var n = c[ch] || 0, pct = total ? Math.round(n * 100 / total) : 0;
      var ok = state.reveal && q.answer === ch;
      return '<div class="bar' + (ok ? " correct" : "") + '"><i style="width:' + pct + '%"></i><b>' + esc(ch) + (ok ? " ✓ 正解" : "") + "</b><span>" + n + "人（" + pct + "%）</span></div>";
    }).join("");
  }
  function renderManual() {
    var q = Q[idx];
    $("manual").innerHTML = q.choices.map(function (ch, k) {
      return '<div class="row"><span class="grow">' + esc(ch) + '</span><input type="number" min="0" data-k="' + k + '" value="' + (manual[ch] || 0) + '"></div>';
    }).join("");
    Array.prototype.forEach.call($("manual").querySelectorAll("input"), function (inp) {
      inp.oninput = function () { manual[q.choices[+inp.getAttribute("data-k")]] = Math.max(0, +inp.value || 0); drawBars(manual); };
    });
  }
  $("prev").onclick = function () { show(idx - 1); };
  $("next").onclick = function () { show(idx + 1); };
  $("qlist").onchange = function () { show(+$("qlist").value); };
  $("reveal").onclick = function () {
    var q = Q[idx]; if (!q) return;
    state.reveal = true; KozaAPI.put("vstate_" + SETID, state);
    $("hint").classList.remove("hidden");
    $("hint").innerHTML = (q.answer ? "正解は <b>" + esc(q.answer) + "</b>" : "この問題の正解は、先生から発表します") + (q.hint ? "<br>" + esc(q.hint) : "");
    if (manualOn) drawBars(manual); else KozaAPI.list("v_" + SETID + "_" + q.id + "_" + state.round).then(function (r) { drawBars(tally(r)); });
  };
  $("again").onclick = function () { var q = Q[idx]; rounds[q.id] = (rounds[q.id] || 0) + 1; show(idx); };
  $("hand").onclick = function () {
    manualOn = !manualOn; $("manual").classList.toggle("hidden", !manualOn);
    $("hand").textContent = manualOn ? "自動の集計にもどす" : "手で数を入れる";
    if (manualOn) drawBars(manual);
  };

  // ---------------- ランキング（点数制のとき） ----------------
  // 先生が出した問題の記録（vstate）から、問題ごとの最後のやり直し回と、正解を見せたかどうかを調べる
  function history() {
    return KozaAPI.list("vstate_" + SETID).then(function (rows) {
      var last = {}, shown = {}, sts = [];
      rows.forEach(function (r) { var st = KozaAPI.parse(r.value, null); if (st && st.q && (st.ss || "") === SS) sts.push(st); });
      sts.forEach(function (st) { var rd = st.round || 0; if (last[st.q] === undefined || rd > last[st.q]) last[st.q] = rd; });
      sts.forEach(function (st) { if (st.reveal && (st.round || 0) === last[st.q]) shown[st.q] = true; });
      return { last: last, shown: shown };
    });
  }
  function computeRanking() {
    return history().then(function (h) {
      var targets = Q.filter(function (q) { return q.answer && h.shown[q.id]; });
      return Promise.all(targets.map(function (q) {
        return KozaAPI.list("v_" + SETID + "_" + q.id + "_" + h.last[q.id]).then(function (rows) { return { q: q, rows: rows }; });
      }));
    }).then(function (res) {
      var score = {}, seen = {}, dev = {}, max = 0;
      res.forEach(function (x) {
        max += pts(x.q);
        var last = {};
        x.rows.forEach(function (r) { var v = parseVote(r.value); if (v.n === null || !NAMES[v.n]) return; last[v.n] = v.c; (dev[v.n] = dev[v.n] || {})[r.client] = 1; });
        Object.keys(last).forEach(function (n) { seen[n] = 1; if (last[n] === x.q.answer) score[n] = (score[n] || 0) + pts(x.q); });
      });
      var list = Object.keys(seen).map(function (n) { return { n: +n, s: score[n] || 0 }; });
      list.sort(function (a, b) { return b.s - a.s || a.n - b.n; });
      list.forEach(function (e, i) { e.rank = (i > 0 && list[i - 1].s === e.s) ? list[i - 1].rank : i + 1; });
      var dup = Object.keys(dev).filter(function (n) { return Object.keys(dev[n]).length > 1; }).map(function (n) { return NAMES[n]; });
      var fin = res.some(function (x) { return x.q.id.charAt(0) === "r"; });
      return { list: list, count: res.length, max: max, dup: dup, title: fin ? "最終発表" : "中間発表" };
    });
  }
  var R = null, step = 0;   // step：0＝まだ、1＝3位、2＝2位、3＝1位、4＝全部
  function drawRank() {
    if (!R) return;
    $("rtitle").textContent = "🏆 ランキング　" + R.title;
    $("rankview").classList.toggle("many", R.list.length > 15);   // 人数が多いときは小さめに並べる
    $("rsub").textContent = R.count + "問の結果（満点 " + R.max + "点）・" + R.list.length + "人";
    var MED = { 1: "🥇", 2: "🥈", 3: "🥉" }, OPEN = { 3: 1, 2: 2, 1: 3 };
    $("podium").innerHTML = [2, 1, 3].map(function (r) {
      var who = R.list.filter(function (e) { return e.rank === r; });
      var open = step >= OPEN[r];
      var body = !who.length ? '<div class="who">—</div>' : open
        ? '<div class="who' + (who.length > 2 ? " m3" : who.length > 1 ? " m2" : "") + '">' + who.map(function (e) { return '<span class="nm">' + esc(NAMES[e.n]) + "</span>"; }).join("") + '</div><div class="sc">' + who[0].s + "点</div>"
        : '<div class="hide">？</div>';
      return '<div class="pod r' + r + '"><div class="medal">' + MED[r] + "</div><div>" + r + "位</div>" + body + "</div>";
    }).join("");
    $("rlist").innerHTML = step >= 4 ? R.list.filter(function (e) { return e.rank > 3; }).map(function (e) {
      return "<div><b>" + e.rank + "位</b><span class=\"nm\">" + esc(NAMES[e.n]) + "</span><span class=\"sc\">" + e.s + "点</span></div>"; }).join("") : "";
    $("rwarn").classList.toggle("hidden", !R.dup.length);
    $("rwarn").textContent = R.dup.length ? "同じどうぶつを2台以上で選んでいます：" + R.dup.join("、") + "（あとから送った答えで数えています）" : "";
    $("rnext").disabled = step >= 4;
  }
  function openRank() {
    $("rankview").classList.remove("hidden"); $("rtitle").textContent = "🏆 集計しています…"; $("rsub").textContent = ""; $("podium").innerHTML = ""; $("rlist").innerHTML = "";
    computeRanking().then(function (r) { R = r; step = 0; drawRank(); })
      .catch(function () { $("rtitle").textContent = "集計できませんでした。もう一度「集計しなおす」を押してください"; });
  }
  $("rank").onclick = openRank;
  $("rre").onclick = openRank;
  $("rnext").onclick = function () { step = Math.min(4, step + 1); drawRank(); };
  $("rall").onclick = function () { step = 4; drawRank(); };
  $("rclose").onclick = function () { $("rankview").classList.add("hidden"); };
  // 講座の前のテストの答えを消して、第1問から始める（先生用の番号が必要）
  $("restart").onclick = function () {
    if (!confirm("全部の問題の答えと点数を消して、第1問から始めます。よろしいですか？")) return;
    var pin = teacherPin(); if (!pin) return;
    var btn = $("restart"); btn.disabled = true;
    history().then(function (h) {
      var keys = [];
      Q.forEach(function (q) { var m = Math.max(h.last[q.id] || 0, rounds[q.id] || 0); for (var r = 0; r <= m; r++) keys.push("v_" + SETID + "_" + q.id + "_" + r); });
      var i = 0;
      function nextKey() {
        if (i >= keys.length) return Promise.resolve();
        btn.textContent = "消しています " + (i + 1) + "/" + keys.length;
        return KozaAPI.reset(keys[i++], pin).then(function (j) { if (!j || !j.ok) throw new Error((j && j.error) || "reset"); return nextKey(); });
      }
      return nextKey();
    }).then(function () {
      SS = Date.now().toString(36); rounds = {}; show(0);
      btn.textContent = "消しました ✓（第1問から）";
    }).catch(function (e) {
      if (String(e.message).indexOf("pin") >= 0) sessionStorage.removeItem("koza_pin");
      btn.textContent = "消せませんでした（番号を確かめて、もう一度）";
    }).then(function () { btn.disabled = false; setTimeout(function () { btn.textContent = "はじめからやり直す（全問）"; }, 4000); });
  };
  document.addEventListener("keydown", function (e) {
    if (!$("rankview").classList.contains("hidden")) { if (e.key === "ArrowRight" || e.key === " ") $("rnext").click(); return; }   // ランキング中は矢印で次の順位
    if (e.key === "ArrowRight") show(idx + 1); if (e.key === "ArrowLeft") show(idx - 1);
  });
  // 前回の続きから始める
  KozaAPI.latest("vstate_" + SETID).then(function (r) {
    var st = r && KozaAPI.parse(r.value, null);
    if (st && st.ss) SS = st.ss;
    if (st && st.q) { for (var i = 0; i < Q.length; i++) if (Q[i].id === st.q) { rounds[st.q] = st.round || 0; show(i); return; } }
    show(0);
  }).catch(function () { show(0); });
})();
</script>
</body>
</html>
